syntax = "proto3";

package bee.v1;

option go_package = "github.com/angels-you/bee/pkg/proto;proto";

// Bee: one call = one job. Job and Result carry json of the public types
// github.com/angels-you/bee/pkg/types (the same json as http and nats):
//
//	Audio   audio.Job    -> audio.Result
//	Stream  video.StreamJob -> video.Result
//	Video   video.VideoJob  -> video.Result
//	Images  images.Job   -> images.Result
//
// A failed job is a gRPC status: the bee code in the message
// ("<CODE>: <message>") and in the bee-error-code / bee-retryable trailers.
// The token is the metadata
// "authorization: Bearer <BEE_TOKEN>".
service Bee {
  rpc Audio(Job) returns (Result);
  rpc Stream(Job) returns (Result);
  rpc Video(Job) returns (Result);
  rpc Images(Job) returns (Result);
}

// Job is the json of a job of its type
message Job {
  bytes json = 1;
}

// Result is the json of a result of its type
message Result {
  bytes json = 1;
}
