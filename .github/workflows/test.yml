name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ffmpeg, vips with heif (heic and avif, read and write) and nats-server for the tests
      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libvips-tools libheif-plugin-libde265 libheif-plugin-x265 libheif-plugin-aomdec libheif-plugin-aomenc
          go install github.com/nats-io/nats-server/v2@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -timeout 20m ./...
